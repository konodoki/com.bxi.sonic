schema: 1
id: com.bxi.sonic
name: SONIC遥操
version: 1.3.1
api: ">=4,<5"
enable: true
entrypoint: plugin:create_mod
visibility: public
requires:
  - id: com.bxi.basic_actions
    version: ">=1,<2"
conflicts: []
python_exports: []
runtime_requirements:
  python:
    - import: zmq
  ros:
    - package: rclpy
    - package: communication
    - package: std_msgs
  system: []

runtime_profiles:
  pico_bootstrap:
    mode: host
  host_ros:
    mode: host

nodes:
  mediamtx_server:
    runtime: command
    entrypoint: mediamtx_launcher.py
    interpreter: python3
    runtime_profile: host_ros
    execution: process
    lifecycle: state
    states:
      - sonic_teleop
    arguments:
      - --config
      - runtime/mediamtx.yml
    environment:
      PYTHONUNBUFFERED: "1"
    scheduling:
      cpu_affinity: background
    manifest:
      label: SONIC头部相机RTSP服务器
    runtime_requirements:
      python: []
      ros: []
      system: []
    restart:
      max_attempts: 3
      delay: 1.0
      non_retryable_exit_codes: [64, 78]
    shutdown:
      signal: SIGINT
      terminate_after: 2.0
      kill_after: 4.0

  head_camera_rtsp:
    runtime: executable
    entrypoint: head_camera_rtsp_node
    runtime_profile: host_ros
    execution: process
    lifecycle: state
    states:
      - sonic_teleop
    depends_on:
      - mediamtx_server
    scheduling:
      cpu_affinity: background
    params:
      simulation_topic: /simulation/head_depth_camera/color/image_raw
      hardware_topic: /hardware/head_depth_camera/color/image_raw
      source_mode: auto
      source_timeout_s: 0.5
      hardware_promote_frames: 3
      rtsp_url: rtsp://127.0.0.1:2212/video
      readiness_host: 127.0.0.1
      readiness_port: 2212
      rtsp_transport: udp
      encoder: libx264
      output_width: 424
      output_height: 240
      output_fps: 60
      bitrate: 3000000
      gop_size: 15
      network_timeout_s: 2.0
      statistics_interval_s: 5.0
    manifest:
      label: SONIC头部相机RTSP推流器
    runtime_requirements:
      python: []
      ros:
        - package: rclcpp
        - package: sensor_msgs
      system:
        - library: avcodec
        - library: avformat
        - library: avutil
        - library: swscale
        - library: x264
    restart:
      max_attempts: 3
      delay: 1.0
      non_retryable_exit_codes: [64, 78]
    shutdown:
      signal: SIGINT
      terminate_after: 3.0
      kill_after: 5.0

  pico_manager:
    runtime: command
    entrypoint: pico/manager_launcher.py
    interpreter: python3
    runtime_profile: pico_bootstrap
    execution: process
    lifecycle: state
    states:
      - sonic_teleop
    arguments:
      - --manager
      - --num_frames_to_send
      - "10"
      - --target_fps
      - "50"
    environment:
      PYTHONUNBUFFERED: "1"
    manifest:
      label: SONIC PICO管理器
    runtime_requirements:
      python: []
      ros: []
      system: []
    restart:
      max_attempts: 3
      delay: 3.0
      non_retryable_exit_codes: [78]
    shutdown:
      signal: SIGINT
      terminate_after: 3.0
      kill_after: 5.0

  smpl_bridge:
    runtime: python
    entrypoint: pico.pose_to_smpl_ref_bridge:create_node
    execution: in_process
    runtime_profile: host_ros
    lifecycle: state
    states:
      - sonic_teleop
    depends_on:
      - pico_manager
    params:
      pico_host: 127.0.0.1
      pico_port: 5556
      pico_topic: pose
      out_host: 127.0.0.1
      out_port: 5557
      out_topic: smpl_ref
      rate_hz: 50.0
      stale_warning_seconds: 0.5
    manifest:
      label: SONIC SMPL参考桥
    runtime_requirements:
      python:
        - import: zmq
      ros:
        - package: rclpy
        - package: std_msgs
      system: []

  zerolab_source:
    runtime: python
    entrypoint: zerolab.source_node:create_node
    execution: process
    runtime_profile: host_ros
    lifecycle: state
    states: [sonic_zerolab]
    params:
      udp_bind_host: 0.0.0.0
      udp_port: 18000
      allowed_sender: 192.168.89.171
      pose_host: 127.0.0.1
      pose_port: 5558
      pose_topic: pose
      rate_hz: 50.0
      window_frames: 10
      stale_seconds: 0.5
      jitter_buffer_seconds: 0.04
      short_recovery_blend_seconds: 0.2
      recovery_real_frames: 10
      record_path: ""
    manifest:
      label: ZeroLab姿态源
    runtime_requirements:
      python:
        - import: numpy
        - import: scipy
        - import: zmq
      ros:
        - package: rclpy
      system: []
    shutdown:
      signal: SIGINT
      terminate_after: 3.0
      kill_after: 5.0

  zerolab_bridge:
    runtime: python
    entrypoint: pico.pose_to_smpl_ref_bridge:create_node
    execution: in_process
    runtime_profile: host_ros
    lifecycle: state
    states: [sonic_zerolab]
    depends_on: [zerolab_source]
    params:
      pico_host: 127.0.0.1
      pico_port: 5558
      pico_topic: pose
      out_host: 127.0.0.1
      out_port: 5557
      out_topic: smpl_ref
      rate_hz: 50.0
      stale_warning_seconds: 0.5
    manifest:
      label: ZeroLab SMPL参考桥
    runtime_requirements:
      python:
        - import: zmq
      ros:
        - package: rclpy
        - package: std_msgs
      system: []

events:
  activate:
    slot: btn_10
    value: 9
  activate_zerolab:
    slot: btn_10
    value: 11
  arm_zerolab:
    slot: btn_10
    value: 12
  reset_alignment:
    slot: btn_9
    value: 1

states:
  sonic_teleop:
    manifest:
      label: SONIC遥操
      priority: 840
      group: Advanced
      icon: sports_esports
      confirm: true
      confirm_message: >-
        使用前务必查看官方WIKI，进入后先保持idle站立；若启用夹爪，请先松开左右trigger并确认周围安全；
        当前IP：${bxi.system.ip}
    params:
      require_live_reference: false
      yaw_bias_rad: 1.57079632679
      live_reference_timeout_s: 0.5
      idle_frame_start: 3509
      source_blend_seconds: 0.4
      head_control_enabled: false
      head_pitch_limit_rad: 0.5
      head_yaw_limit_rad: 1.0
      head_pitch_speed_rad_s: 1.5
      head_yaw_speed_rad_s: 2.0
      head_deadband_rad: 0.015
      hardware_gripper: true
      gripper_enable_interval_s: 1.0
      gripper_left_bus: 5
      gripper_right_bus: 6
      gripper_can_id: 1
      gripper_master_id: 17
      gripper_skip_motor_id_check: false
      gripper_kp: 3.0
      gripper_kd: 1.0
      gripper_calibration_speed_rad_s: 2.0
      gripper_calibration_kp: 5.0
      gripper_calibration_kd: 0.5
      gripper_contact_torque: 0.5
      gripper_abort_torque: 2.5
      gripper_contact_confirm_s: 0.25
      gripper_stopped_velocity_rad_s: 0.5
      gripper_tracking_error_rad: 0.08
      gripper_limit_margin_rad: 0.15
      gripper_minimum_span_rad: 1.0
      gripper_maximum_search_travel_rad: 7.0
      gripper_response_timeout_s: 1.0
      gripper_feedback_timeout_s: 0.3
      gripper_phase_timeout_s: 50.0
      gripper_maximum_mos_temperature_c: 120
      gripper_maximum_motor_temperature_c: 120

  sonic_zerolab:
    manifest:
      label: SONIC ZeroLab遥操
      priority: 839
      group: Advanced
      icon: accessibility_new
      confirm: true
      confirm_message: >-
        请先在ZeroLab厂家软件完成N-pose标定并回到中立姿势；进入后等待ZeroLab stream ready
    params:
      operator_prompt: >-
        机器人保持实时Normal直到stream ready；确认操作者处于中立姿势后，由安全员发送btn_10=12接管；再次发送可暂停并回到WAIT_ARM
      arm_blend_seconds: 2.0
      auto_rearm_on_recovery: true
      auto_rearm_blend_seconds: 2.0
      recovery_real_frames: 10
      require_live_reference: false
      yaw_bias_rad: 1.57079632679
      live_reference_timeout_s: 0.5
      idle_frame_start: 3509
      source_blend_seconds: 0.4
      head_control_enabled: false
      hardware_gripper: false

routes:
  - from: com.bxi.basic_actions/normal
    event: activate
    to: sonic_teleop
    transition: soft_switch
  - from: sonic_teleop
    event: com.bxi.basic_actions/normal
    to: com.bxi.basic_actions/normal
    transition: soft_switch
  - from: sonic_teleop
    event: com.bxi.basic_actions/zero_torque
    to: com.bxi.basic_actions/zero_torque
  - from: sonic_teleop
    event: com.bxi.basic_actions/pd_brake
    to: com.bxi.basic_actions/pd_brake
  - from: sonic_teleop
    event: com.bxi.basic_actions/recover
    to: com.bxi.basic_actions/recover
    transition: soft_switch
  - from: com.bxi.basic_actions/normal
    event: activate_zerolab
    to: sonic_zerolab
    transition: soft_switch
  - from: sonic_zerolab
    event: com.bxi.basic_actions/normal
    to: com.bxi.basic_actions/normal
    transition: soft_switch
  - from: sonic_zerolab
    event: com.bxi.basic_actions/zero_torque
    to: com.bxi.basic_actions/zero_torque
  - from: sonic_zerolab
    event: com.bxi.basic_actions/pd_brake
    to: com.bxi.basic_actions/pd_brake
  - from: sonic_zerolab
    event: com.bxi.basic_actions/recover
    to: com.bxi.basic_actions/recover
    transition: soft_switch

actions:
  - from: sonic_teleop
    event: reset_alignment
    action: reset_alignment
    manifest:
      label: 重置朝向对齐
      ui: refresh
  - from: sonic_zerolab
    event: arm_zerolab
    action: arm_zerolab
    manifest:
      label: ZeroLab ARM / 暂停
      ui: shield
